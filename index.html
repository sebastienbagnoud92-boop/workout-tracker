<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Workout"/>
<meta name="theme-color" content="#07070f"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<title>Workout Tracker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#07070f;color:#e0e0ec;font-family:'Courier New',monospace;font-size:13px;min-height:100vh;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer;border:none}
input{font-family:inherit}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
input[type=number]{-moz-appearance:textfield}
:root{--c:#07070f}

/* HEADER */
#header{position:sticky;top:0;z-index:50;background:rgba(7,7,15,0.97);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,0.05);padding:12px 14px 10px}
#header-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
#day-title{font-size:17px;font-weight:700;letter-spacing:-0.5px}
#day-sub{font-size:10px;color:#3a3a5a;margin-top:1px}
#header-label{font-size:9px;color:#333;letter-spacing:4px;text-transform:uppercase}
#header-btns{display:flex;gap:6px;flex-direction:column;align-items:flex-end}
.hbtn{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:7px;padding:5px 10px;color:#777;font-size:9px;letter-spacing:1px;text-transform:uppercase}
#save-btn{display:none;font-weight:700;font-size:9px;border-radius:7px;padding:5px 10px;letter-spacing:1px;border:none}

/* PROGRESS */
#prog-wrap{margin-bottom:8px}
#prog-label{display:flex;justify-content:space-between;font-size:9px;color:#333;margin-bottom:3px}
#prog-bar-bg{background:rgba(255,255,255,0.05);border-radius:3px;height:3px}
#prog-bar{height:100%;border-radius:3px;transition:width .3s;width:0%}

/* DAY TABS */
#tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;border:none;border-radius:6px;padding:5px 9px;font-size:9px;font-weight:700;letter-spacing:1px;transition:all .15s}

/* CONTENT */
#content{padding:14px 14px 130px}

/* SECTION */
.section-title{font-size:9px;letter-spacing:3px;text-transform:uppercase;margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid rgba(255,255,255,0.05);color:#333;display:flex;align-items:center;gap:6px}
.section-title.highlight{border-bottom-color:rgba(200,200,255,0.15)}
.dot{width:5px;height:5px;border-radius:50%;display:inline-block;flex-shrink:0}

/* EXERCISE CARD */
.ex-card{border-radius:10px;padding:11px 13px;margin-bottom:7px;border:1px solid rgba(255,255,255,0.06);transition:opacity .3s}
.ex-card.done-all{opacity:.4;border-color:rgba(255,255,255,0.03)}
.ex-name{font-size:13px;font-weight:600;color:#ddd;line-height:1.3}
.ex-meta{font-size:10px;color:#3a3a5a;margin-top:2px}
.ex-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.cfg-btn{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:6px;color:#555;font-size:10px;padding:3px 8px}

/* CONFIG PANEL */
.cfg-panel{background:rgba(0,0,0,0.3);border-radius:8px;padding:10px;margin-bottom:10px;display:none;flex-wrap:wrap;gap:10px}
.cfg-panel.open{display:flex}
.cfg-field{display:flex;flex-direction:column;gap:3px;min-width:70px}
.cfg-field-label{font-size:8px;color:#3a3a5a;letter-spacing:2px;text-transform:uppercase}
.cfg-field-row{display:flex;align-items:center;gap:4px}
.cfg-adj{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);border-radius:5px;color:#888;width:22px;height:26px;font-size:14px;display:flex;align-items:center;justify-content:center;padding:0}
.cfg-input{width:44px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:5px;color:#ccc;font-size:12px;text-align:center;padding:4px 2px;outline:none}

/* SETS ROW */
.sets-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.set-col{display:flex;flex-direction:column;align-items:center;gap:3px}
.set-label{font-size:8px;color:#2a2a4a;letter-spacing:1px}
.set-btn{width:36px;height:30px;border-radius:7px;font-weight:700;font-size:10px;transition:all .15s;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.05);color:#333}
.set-btn.done{color:#000;font-size:14px}
.timer-btn{margin-left:auto;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:7px;padding:5px 10px;color:#444;font-size:9px;letter-spacing:1px}

/* TIMER */
#timer-float{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:200;min-width:220px;border-radius:18px;padding:14px 20px;display:none;align-items:center;gap:14px;box-shadow:0 16px 60px rgba(0,0,0,0.8);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);background:rgba(12,12,22,0.98)}
#timer-float.active{display:flex}
#timer-float.finished{background:#22c55e;border-color:#22c55e}
#timer-label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#444}
#timer-float.finished #timer-label{color:#000}
#timer-time{font-size:38px;font-weight:700;letter-spacing:-2px;line-height:1;color:#fff}
#timer-float.finished #timer-time{color:#000}
#timer-time.danger{color:#f87171}
#timer-btns{display:flex;flex-direction:column;gap:5px}
.tbtn{border:none;border-radius:8px;color:#fff;padding:7px 12px;font-size:14px;background:rgba(255,255,255,0.1)}
.tbtn.close{background:rgba(255,255,255,0.06);color:#555;font-size:12px}

/* HISTORY */
#history{display:none;padding:14px 14px 100px}
.hist-day-title{font-size:11px;font-weight:700;margin-bottom:8px;letter-spacing:1px}
.hist-session{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.05);border-radius:9px;padding:10px 12px;margin-bottom:7px}
.hist-date{font-size:9px;color:#444;margin-bottom:7px;letter-spacing:1px}
.hist-row{display:flex;justify-content:space-between;margin-bottom:4px;align-items:center}
.hist-exname{font-size:10px;color:#555;flex:1;margin-right:8px}
.hist-val{font-size:10px;color:#888;white-space:nowrap}

/* REST DAY */
#rest-day{text-align:center;padding-top:60px;color:#333}
#rest-day .emoji{font-size:40px;margin-bottom:12px}
</style>
</head>
<body>

<div id="header">
  <div id="header-top">
    <div>
      <div id="header-label">PROGRAMME</div>
      <div id="day-title">—</div>
      <div id="day-sub">—</div>
    </div>
    <div id="header-btns">
      <button class="hbtn" id="hist-toggle-btn" onclick="toggleHistory()">Historique</button>
      <button id="save-btn" onclick="saveSession()">💾 SAUVEGARDER</button>
    </div>
  </div>
  <div id="prog-wrap" style="display:none">
    <div id="prog-label"><span id="prog-text">0/0 séries</span><span id="prog-pct">0%</span></div>
    <div id="prog-bar-bg"><div id="prog-bar"></div></div>
  </div>
  <div id="tabs"></div>
</div>

<div id="content"></div>
<div id="history"></div>
<div id="rest-day" style="display:none"><div class="emoji">😴</div><div style="color:#555;font-size:15px">Repos — récupération active</div></div>

<div id="timer-float">
  <div>
    <div id="timer-label">REPOS</div>
    <div id="timer-time">0:00</div>
  </div>
  <div id="timer-btns">
    <button class="tbtn" id="timer-pause-btn" onclick="timerTogglePause()">⏸</button>
    <button class="tbtn close" onclick="timerClose()">✕</button>
  </div>
</div>

<script>
// ─── DATA ────────────────────────────────────────────────────────────────────
const WU_STD = { name:"ÉCHAUFFEMENT STANDARD", isWarmup:true, exercises:[
  {id:"wu_ob", name:"Over & Back (bâton/bande)",  ds:2, dr:12, dw:0, drest:30, hw:false},
  {id:"wu_ws", name:"Wall Slides",                ds:2, dr:10, dw:0, drest:30, hw:false},
  {id:"wu_dh", name:"Dead Hang passif → actif",   ds:2, dr:30, dw:0, drest:30, hw:false, ru:"s"},
  {id:"wu_sc", name:"Scapula Pull-ups",           ds:2, dr:8,  dw:0, drest:30, hw:false},
]};
const WU_LEGS = { name:"ÉCHAUFFEMENT BAS DU CORPS", isWarmup:true, exercises:[
  {id:"wu_hf", name:"Hip Flexor Stretch dynamique", ds:1, dr:30, dw:0, drest:0,  hw:false, ru:"s/côté"},
  {id:"wu_gb", name:"Glute Bridge",                 ds:2, dr:12, dw:0, drest:30, hw:false},
]};
const mkSh = (p) => ({ name:"🎯 ÉPAULES — LATÉRAUX", highlight:true, exercises:[
  {id:`${p}_lc`, name:"Élévations latérales câble",           ds:4, dr:18, dw:14, drest:60, hw:true},
  {id:`${p}_ld`, name:"Élévations latérales haltères (uni)",  ds:3, dr:18, dw:8,  drest:60, hw:true},
  {id:`${p}_rd`, name:"Arrière épaule câble / Face Pull",     ds:3, dr:18, dw:10, drest:60, hw:true},
]});

const PROGRAM = {
  Lundi:   { label:"FRONT SPLIT",   sub:"Mobilité",            color:"#a78bfa", strength:false, sections:[
    {name:"ACTIVATION", exercises:[
      {id:"l_cc", name:"Cat-Cow + Hollow Body", ds:1, dr:30, dw:0, drest:0, hw:false, ru:"s"},
    ]},
    {name:"FRONT SPLIT / HANCHES", exercises:[
      {id:"l_cs", name:"Couch Stretch",  ds:3, dr:90, dw:0, drest:30, hw:false, ru:"s/côté"},
      {id:"l_50", name:"50/50 Split",    ds:2, dr:60, dw:0, drest:30, hw:false, ru:"s"},
      {id:"l_hs", name:"Half Split",     ds:2, dr:60, dw:0, drest:30, hw:false, ru:"s/côté"},
      {id:"l_dp", name:"Dragon Pose",    ds:2, dr:60, dw:0, drest:30, hw:false, ru:"s"},
    ]},
  ]},
  Mardi:   { label:"PUSH",          sub:"Push + Skills",       color:"#f87171", strength:true, sections:[
    WU_STD,
    {name:"SKILLS", exercises:[
      {id:"ma_tr", name:"Tractions PDC — rappel", ds:3, dr:10, dw:0, drest:60, hw:false},
    ]},
    {name:"FORCE", exercises:[
      {id:"ma_di", name:"Dips lestés",           ds:5, dr:4,  dw:35, drest:150, hw:true},
      {id:"ma_ip", name:"Incline DB Press",      ds:3, dr:9,  dw:22, drest:90,  hw:true},
      {id:"ma_fl", name:"Low-to-High Cable Fly", ds:3, dr:12, dw:14, drest:90,  hw:true},
    ]},
    mkSh("ma"),
    {name:"CORE", exercises:[
      {id:"ma_hh", name:"Hollow Hold", ds:3, dr:35, dw:0, drest:60, hw:false, ru:"s"},
    ]},
  ]},
  Mercredi:{ label:"LEGS",          sub:"Lower + Athlétique",  color:"#fbbf24", strength:true, sections:[
    WU_STD, WU_LEGS,
    {name:"FORCE", exercises:[
      {id:"me_atg", name:"ATG Split Squat",        ds:3, dr:6,  dw:6,  drest:120, hw:true},
      {id:"me_nc",  name:"Nordic Curl / RDL",      ds:3, dr:5,  dw:0,  drest:120, hw:false},
      {id:"me_ss",  name:"Sissy Squat",            ds:3, dr:8,  dw:0,  drest:90,  hw:false},
      {id:"me_bj",  name:"Box Jumps / Sprints",    ds:4, dr:3,  dw:0,  drest:150, hw:false},
      {id:"me_cal", name:"Mollets debout",         ds:3, dr:12, dw:20, drest:45,  hw:true},
      {id:"me_tib", name:"Tibialis Raise",         ds:3, dr:15, dw:0,  drest:45,  hw:false},
      {id:"me_mar", name:"Marche arrière (tapis)", ds:1, dr:5,  dw:0,  drest:0,   hw:false, ru:"min"},
    ]},
    mkSh("me"),
  ]},
  Jeudi:   { label:"MIDDLE SPLIT",  sub:"Mobilité",            color:"#34d399", strength:false, sections:[
    {name:"ACTIVATION", exercises:[
      {id:"j_cc", name:"Cat-Cow + Hollow Body", ds:1, dr:30, dw:0, drest:0, hw:false, ru:"s"},
    ]},
    {name:"MIDDLE SPLIT / ADDUCTEURS", exercises:[
      {id:"j_fr", name:"Frog Stretch",  ds:2, dr:60, dw:0, drest:30, hw:false, ru:"s"},
      {id:"j_ew", name:"Elephant Walk", ds:3, dr:10, dw:0, drest:30, hw:false},
      {id:"j_90", name:"90/90 Lean",    ds:1, dr:45, dw:0, drest:30, hw:false, ru:"s"},
    ]},
  ]},
  Vendredi:{ label:"PULL",          sub:"Pull + Core + Skills",color:"#60a5fa", strength:true, sections:[
    WU_STD,
    {name:"SKILLS", exercises:[
      {id:"v_ls", name:"L-Sit (anneaux/parallettes)", ds:5, dr:20, dw:0, drest:90, hw:false, ru:"s"},
      {id:"v_fl", name:"Front Lever Tuck",            ds:4, dr:15, dw:0, drest:60, hw:false, ru:"s"},
    ]},
    {name:"FORCE", exercises:[
      {id:"v_tr",  name:"Tractions lestées",          ds:5, dr:4,  dw:16, drest:150, hw:true},
      {id:"v_row", name:"Row horizontal (anneaux)",   ds:3, dr:9,  dw:0,  drest:90,  hw:false},
      {id:"v_inc", name:"Développé incliné haltère",  ds:3, dr:9,  dw:20, drest:90,  hw:true},
      {id:"v_spd", name:"Straight Arm Pulldown",      ds:3, dr:12, dw:15, drest:90,  hw:true},
    ]},
    mkSh("v"),
    {name:"CORE", exercises:[
      {id:"v_hlr", name:"Hanging Leg Raises", ds:3, dr:10, dw:0, drest:60, hw:false},
    ]},
  ]},
  Samedi:  { label:"MOBILITY+",     sub:"Weighted Mobility",   color:"#f472b6", strength:false, sections:[
    {name:"ÉPAULES / POSTURE", exercises:[
      {id:"s_po", name:"DB Pullover lent",  ds:3, dr:8,  dw:20, drest:90, hw:true},
      {id:"s_t3", name:"Trap 3 Raises",    ds:3, dr:8,  dw:3,  drest:90, hw:true},
      {id:"s_be", name:"Back Extension",   ds:3, dr:30, dw:8,  drest:90, hw:true},
      {id:"s_pw", name:"Powell Raises",    ds:3, dr:8,  dw:6,  drest:90, hw:true},
    ]},
    {name:"HANCHES / GENOUX", exercises:[
      {id:"s_gs", name:"Goblet Squat Hold ATG",   ds:3, dr:45, dw:16, drest:60, hw:true,  ru:"s"},
      {id:"s_co", name:"Cossack Squat (3-1-1)",   ds:3, dr:6,  dw:0,  drest:60, hw:false, ru:"/côté"},
      {id:"s_cp", name:"Couch Stretch + Pigeon",  ds:2, dr:50, dw:0,  drest:45, hw:false, ru:"s/côté"},
    ]},
    {name:"COLONNE", exercises:[
      {id:"s_jc", name:"Jefferson Curl",            ds:3, dr:8,  dw:10, drest:60, hw:true},
      {id:"s_lo", name:"Weighted Lombaire",         ds:3, dr:8,  dw:10, drest:60, hw:true},
      {id:"s_dh", name:"Dead Hang",                 ds:3, dr:25, dw:0,  drest:60, hw:false, ru:"s"},
      {id:"s_th", name:"Thoracic Extension Roller", ds:3, dr:60, dw:0,  drest:45, hw:false, ru:"s"},
      {id:"s_hb", name:"Hollow Body Hold",          ds:3, dr:40, dw:0,  drest:60, hw:false, ru:"s"},
    ]},
  ]},
  Dimanche:{ label:"REPOS", sub:"Récupération active", color:"#4b5563", strength:false, sections:[] },
};
const DAYS = ["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
const SHORT = {Lundi:"LUN",Mardi:"MAR",Mercredi:"MER",Jeudi:"JEU",Vendredi:"VEN",Samedi:"SAM",Dimanche:"DIM"};

// ─── STATE ───────────────────────────────────────────────────────────────────
function ls(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}

let sessions = ls("wt_sessions_v5", {});   // sessions[dayName] = [{date, exercises:{exId:{sets,reps,weight,rest}}}]
let current  = ls("wt_current_v5",  {});   // current[dayName][exId] = {sets,reps,weight,rest}
let doneMap  = ls("wt_done_v5",     {});   // doneMap[dayName_date][exId_si] = bool

let activeDay = DAYS[(new Date().getDay()+6)%7];
let showHistory = false;

// Timer state
let timerInterval = null;
let timerSeconds  = 0;
let timerPaused   = false;
let timerActive   = false;

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function fmt(s){return`${Math.floor(s/60)}:${(s%60).toString().padStart(2,'0')}`}
function today(){return new Date().toISOString().split("T")[0]}
function doneKey(){return`${activeDay}_${today()}`}

function getLastSession(dayName){
  const arr = sessions[dayName];
  return arr && arr.length ? arr[arr.length-1] : null;
}
function getCfg(dayName, ex){
  if(current[dayName]?.[ex.id]) return current[dayName][ex.id];
  const last = getLastSession(dayName);
  if(last?.exercises?.[ex.id]) return last.exercises[ex.id];
  return {sets:ex.ds, reps:ex.dr, weight:ex.dw, rest:ex.drest};
}
function setCfg(dayName, exId, field, val){
  if(!current[dayName]) current[dayName]={};
  if(!current[dayName][exId]) current[dayName][exId]={};
  current[dayName][exId][field]=val;
  lsSet("wt_current_v5", current);
}
function isDone(exId, si){return !!doneMap[doneKey()]?.[`${exId}_${si}`]}
function setDone(exId, si, v){
  if(!doneMap[doneKey()]) doneMap[doneKey()]={};
  doneMap[doneKey()][`${exId}_${si}`]=v;
  lsSet("wt_done_v5", doneMap);
}

// ─── TIMER ───────────────────────────────────────────────────────────────────
function startTimer(sec, label){
  clearInterval(timerInterval);
  timerSeconds = parseInt(sec)||0;
  timerPaused  = false;
  timerActive  = true;
  const el = document.getElementById("timer-float");
  el.className = "active";
  document.getElementById("timer-label").textContent = "REPOS — " + label.toUpperCase();
  document.getElementById("timer-pause-btn").textContent = "⏸";
  renderTimerTime();
  timerInterval = setInterval(()=>{
    if(timerPaused) return;
    timerSeconds--;
    if(timerSeconds<=0){
      timerSeconds=0;
      clearInterval(timerInterval);
      el.classList.add("finished");
      document.getElementById("timer-label").textContent = "🔥 C'EST PARTI !";
    }
    renderTimerTime();
  },1000);
}
function renderTimerTime(){
  const el = document.getElementById("timer-time");
  el.textContent = fmt(timerSeconds);
  el.className = timerSeconds < 10 && timerSeconds > 0 ? "danger" : "";
}
function timerTogglePause(){
  timerPaused = !timerPaused;
  document.getElementById("timer-pause-btn").textContent = timerPaused ? "▶" : "⏸";
}
function timerClose(){
  clearInterval(timerInterval);
  timerActive=false;
  const el=document.getElementById("timer-float");
  el.className="";
}

// ─── SAVE SESSION ─────────────────────────────────────────────────────────────
function saveSession(){
  const day = PROGRAM[activeDay];
  const exMap = {};
  day.sections.flatMap(s=>s.exercises).forEach(ex=>{
    exMap[ex.id] = {...getCfg(activeDay, ex)};
  });
  if(!sessions[activeDay]) sessions[activeDay]=[];
  sessions[activeDay].push({date:today(), exercises:exMap});
  lsSet("wt_sessions_v5", sessions);
  if(current[activeDay]) { delete current[activeDay]; lsSet("wt_current_v5", current); }
  alert("✅ Séance sauvegardée !");
  renderDay();
}

// ─── PROGRESS ────────────────────────────────────────────────────────────────
function calcProgress(){
  const day = PROGRAM[activeDay];
  if(!day.sections.length) return {done:0,total:0};
  let total=0, done=0;
  day.sections.flatMap(s=>s.exercises).forEach(ex=>{
    const cfg = getCfg(activeDay, ex);
    const sets = parseInt(cfg.sets)||ex.ds;
    total += sets;
    for(let i=0;i<sets;i++) if(isDone(ex.id,i)) done++;
  });
  return {done, total};
}
function updateProgress(){
  const {done,total} = calcProgress();
  const pct = total>0 ? done/total : 0;
  document.getElementById("prog-text").textContent = `${done}/${total} séries`;
  document.getElementById("prog-pct").textContent  = `${Math.round(pct*100)}%`;
  document.getElementById("prog-bar").style.width  = `${pct*100}%`;
  document.getElementById("prog-bar").style.background = PROGRAM[activeDay].color;
  document.getElementById("prog-wrap").style.display = total>0 ? "block":"none";
  const saveBtn = document.getElementById("save-btn");
  if(pct > 0.8 && total > 0){
    saveBtn.style.display="block";
    saveBtn.style.background = PROGRAM[activeDay].color;
    saveBtn.style.color="#000";
  } else { saveBtn.style.display="none"; }
}

// ─── RENDER TABS ─────────────────────────────────────────────────────────────
function renderTabs(){
  const container = document.getElementById("tabs");
  container.innerHTML = "";
  DAYS.forEach(d=>{
    const b = document.createElement("button");
    b.className = "tab";
    b.textContent = SHORT[d];
    b.style.background = d===activeDay ? PROGRAM[d].color : "rgba(255,255,255,0.04)";
    b.style.color = d===activeDay ? "#000" : "#444";
    b.onclick = ()=>{ activeDay=d; showHistory=false; renderAll(); };
    container.appendChild(b);
  });
}

// ─── RENDER DAY ──────────────────────────────────────────────────────────────
function renderDay(){
  const day = PROGRAM[activeDay];
  document.getElementById("day-title").textContent = `${activeDay} — ${day.label}`;
  document.getElementById("day-title").style.color = day.color;
  document.getElementById("day-sub").textContent   = day.sub;

  const content = document.getElementById("content");
  const restEl  = document.getElementById("rest-day");
  content.innerHTML = "";

  if(activeDay==="Dimanche"){
    content.style.display="none";
    restEl.style.display="block";
    document.getElementById("prog-wrap").style.display="none";
    document.getElementById("save-btn").style.display="none";
    return;
  }
  restEl.style.display="none";
  content.style.display="block";

  day.sections.forEach(sec=>{
    const secEl = document.createElement("div");
    secEl.style.marginBottom="22px";

    const title = document.createElement("div");
    title.className = "section-title" + (sec.highlight?" highlight":"");
    title.style.color = sec.highlight ? day.color : "#333";
    if(sec.highlight){
      const dot = document.createElement("span");
      dot.className="dot";
      dot.style.background=day.color;
      title.appendChild(dot);
    }
    title.appendChild(document.createTextNode(sec.name));
    secEl.appendChild(title);

    sec.exercises.forEach(ex=>{
      secEl.appendChild(renderExCard(ex, day.color, sec.isWarmup||false));
    });
    content.appendChild(secEl);
  });

  updateProgress();
}

// ─── RENDER EXERCISE CARD ─────────────────────────────────────────────────────
function renderExCard(ex, color, isWarmup){
  const cfg = getCfg(activeDay, ex);
  const sets = parseInt(cfg.sets)||ex.ds;
  const card = document.createElement("div");
  card.className = "ex-card";
  card.id = "card_"+ex.id;
  card.style.background = "rgba(255,255,255,0.03)";
  if(isWarmup) card.style.borderColor="rgba(255,255,255,0.04)";

  // Top
  const top = document.createElement("div");
  top.className="ex-top";

  const nameBlock = document.createElement("div");
  nameBlock.style.flex="1";nameBlock.style.marginRight="6px";

  const nameEl = document.createElement("div");
  nameEl.className="ex-name";
  nameEl.textContent=ex.name;

  const metaEl = document.createElement("div");
  metaEl.className="ex-meta";
  metaEl.id="meta_"+ex.id;
  updateMeta(metaEl, cfg, ex, color);

  nameBlock.appendChild(nameEl);
  nameBlock.appendChild(metaEl);

  const cfgBtn = document.createElement("button");
  cfgBtn.className="cfg-btn";
  cfgBtn.textContent="⚙";
  cfgBtn.onclick=()=>{
    const panel=document.getElementById("cfg_"+ex.id);
    panel.classList.toggle("open");
    cfgBtn.textContent = panel.classList.contains("open")?"▲":"⚙";
  };

  top.appendChild(nameBlock);
  top.appendChild(cfgBtn);
  card.appendChild(top);

  // Config panel
  const panel = document.createElement("div");
  panel.className="cfg-panel";
  panel.id="cfg_"+ex.id;

  const fields = [
    {label:"Séries",    field:"sets",   val:cfg.sets,   min:1, max:10,  step:1},
    {label:`Reps${ex.ru?" ("+ex.ru+")":""}`, field:"reps", val:cfg.reps, min:1, max:300, step:1},
    ...(ex.hw ? [{label:"Poids (kg)", field:"weight", val:cfg.weight, min:0, max:300, step:0.5}] : []),
    {label:"Repos (s)", field:"rest",   val:cfg.rest,   min:0, max:600, step:5},
  ];
  fields.forEach(f=>{
    panel.appendChild(makeCfgField(f, ex, color));
  });
  card.appendChild(panel);

  // Sets row
  const setsRow = document.createElement("div");
  setsRow.className="sets-row";
  setsRow.id="sets_"+ex.id;
  renderSets(setsRow, ex, sets, color);
  card.appendChild(setsRow);

  return card;
}

function updateMeta(el, cfg, ex, color){
  const sets=parseInt(cfg.sets)||ex.ds;
  const reps=cfg.reps||ex.dr;
  const weight=cfg.weight||0;
  const rest=parseInt(cfg.rest)||0;
  const ru=ex.ru||"";
  el.innerHTML=`${sets} × ${reps}${ru?" "+ru:""}`
    +(ex.hw&&weight>0?`<span style="color:${color}cc;margin-left:8px">${weight} kg</span>`:"")
    +`<span style="color:#2a2a4a;margin-left:8px">⏱ ${fmt(rest)}</span>`;
}

function makeCfgField({label,field,val,min,max,step}, ex, color){
  const wrap=document.createElement("div");
  wrap.className="cfg-field";
  const lbl=document.createElement("div");
  lbl.className="cfg-field-label";
  lbl.textContent=label;
  const row=document.createElement("div");
  row.className="cfg-field-row";

  const minus=document.createElement("button");
  minus.className="cfg-adj";minus.textContent="−";
  const input=document.createElement("input");
  input.type="number";input.className="cfg-input";
  input.value=val;input.min=min;input.max=max;input.step=step;
  const plus=document.createElement("button");
  plus.className="cfg-adj";plus.textContent="+";

  const update=(v)=>{
    const clamped=Math.min(max,Math.max(min,parseFloat(v)||0));
    input.value=clamped;
    setCfg(activeDay, ex.id, field, clamped);
    // re-render meta
    const cfg2=getCfg(activeDay,ex);
    const metaEl=document.getElementById("meta_"+ex.id);
    if(metaEl) updateMeta(metaEl, cfg2, ex, color);
    // re-render sets if sets changed
    if(field==="sets"){
      const setsRow=document.getElementById("sets_"+ex.id);
      if(setsRow) renderSets(setsRow, ex, parseInt(clamped)||ex.ds, color);
    }
    updateProgress();
  };
  minus.onclick=()=>update(parseFloat(input.value)-step);
  plus.onclick= ()=>update(parseFloat(input.value)+step);
  input.onchange=()=>update(input.value);

  row.appendChild(minus);row.appendChild(input);row.appendChild(plus);
  wrap.appendChild(lbl);wrap.appendChild(row);
  return wrap;
}

function renderSets(container, ex, sets, color){
  container.innerHTML="";
  for(let i=0;i<sets;i++){
    const col=document.createElement("div");
    col.className="set-col";
    const lbl=document.createElement("div");
    lbl.className="set-label";lbl.textContent=`S${i+1}`;
    const btn=document.createElement("button");
    btn.className="set-btn"+(isDone(ex.id,i)?" done":"");
    btn.style.background=isDone(ex.id,i)?color:"rgba(255,255,255,0.05)";
    btn.style.borderColor=isDone(ex.id,i)?color:"rgba(255,255,255,0.08)";
    btn.style.color=isDone(ex.id,i)?"#000":"#333";
    btn.textContent=isDone(ex.id,i)?"✓":"○";
    btn.dataset.exid=ex.id;
    btn.dataset.si=i;
    btn.dataset.color=color;
    btn.dataset.exname=ex.name;
    btn.onclick=function(){
      const exId=this.dataset.exid;
      const si=parseInt(this.dataset.si);
      const c=this.dataset.color;
      const name=this.dataset.exname;
      const wasDone=isDone(exId,si);
      setDone(exId,si,!wasDone);
      this.className="set-btn"+(!wasDone?" done":"");
      this.style.background=!wasDone?c:"rgba(255,255,255,0.05)";
      this.style.borderColor=!wasDone?c:"rgba(255,255,255,0.08)";
      this.style.color=!wasDone?"#000":"#333";
      this.textContent=!wasDone?"✓":"○";
      if(!wasDone){
        const cfg=getCfg(activeDay,{id:exId,ds:3,dr:10,dw:0,drest:60});
        const rest=parseInt(cfg.rest)||0;
        if(rest>0) startTimer(rest,name);
      }
      // check all done for card opacity
      const cardSets=parseInt(getCfg(activeDay,{id:exId,ds:3}).sets)||3;
      let allD=true;
      for(let j=0;j<cardSets;j++) if(!isDone(exId,j)){allD=false;break;}
      const card=document.getElementById("card_"+exId);
      if(card){card.classList.toggle("done-all",allD);}
      updateProgress();
    };
    col.appendChild(lbl);col.appendChild(btn);
    container.appendChild(col);
  }
  // Timer button
  const cfg=getCfg(activeDay,ex);
  const rest=parseInt(cfg.rest)||0;
  if(rest>0){
    const tbtn=document.createElement("button");
    tbtn.className="timer-btn";
    tbtn.textContent=`⏱ ${fmt(rest)}`;
    tbtn.onclick=()=>startTimer(rest,ex.name);
    container.appendChild(tbtn);
  }
}

// ─── HISTORY ─────────────────────────────────────────────────────────────────
function renderHistory(){
  const el = document.getElementById("history");
  el.innerHTML="";

  // Build ex name map
  const exMap={};
  Object.values(PROGRAM).forEach(d=>d.sections.forEach(s=>s.exercises.forEach(e=>{exMap[e.id]=e;})));

  const hasSessions = Object.values(sessions).some(arr=>arr&&arr.length>0);
  if(!hasSessions){
    el.innerHTML='<div style="text-align:center;color:#333;padding-top:60px"><div style="font-size:30px;margin-bottom:10px">📊</div><div>Aucun historique encore.</div></div>';
    return;
  }

  const header=document.createElement("div");
  header.style.cssText="font-size:9px;color:#333;letter-spacing:3px;text-transform:uppercase;margin-bottom:14px";
  header.textContent="HISTORIQUE PAR JOUR";
  el.appendChild(header);

  DAYS.forEach(dayName=>{
    const arr=sessions[dayName];
    if(!arr||!arr.length) return;
    const day=PROGRAM[dayName];

    const dayTitle=document.createElement("div");
    dayTitle.className="hist-day-title";
    dayTitle.style.color=day.color;
    dayTitle.textContent=`${dayName} — ${day.label}`;
    el.appendChild(dayTitle);

    [...arr].reverse().slice(0,5).forEach(session=>{
      const sEl=document.createElement("div");
      sEl.className="hist-session";
      const dateEl=document.createElement("div");
      dateEl.className="hist-date";dateEl.textContent=session.date;
      sEl.appendChild(dateEl);
      Object.entries(session.exercises||{}).forEach(([exId,cfg])=>{
        const ex=exMap[exId];if(!ex)return;
        const row=document.createElement("div");
        row.className="hist-row";
        const nameEl=document.createElement("span");
        nameEl.className="hist-exname";nameEl.textContent=ex.name;
        const valEl=document.createElement("span");
        valEl.className="hist-val";
        const ru=ex.ru||"";
        valEl.innerHTML=`${cfg.sets}×${cfg.reps}${ru?" "+ru:""}`
          +(cfg.weight>0?`<span style="color:${day.color}cc;margin-left:6px">${cfg.weight}kg</span>`:"");
        row.appendChild(nameEl);row.appendChild(valEl);
        sEl.appendChild(row);
      });
      el.appendChild(sEl);
    });
  });
}

// ─── TOGGLE HISTORY ──────────────────────────────────────────────────────────
function toggleHistory(){
  showHistory=!showHistory;
  document.getElementById("content").style.display   = showHistory?"none":"block";
  document.getElementById("history").style.display   = showHistory?"block":"none";
  document.getElementById("rest-day").style.display  = "none";
  document.getElementById("prog-wrap").style.display = showHistory?"none":"block";
  document.getElementById("save-btn").style.display  = "none";
  document.getElementById("hist-toggle-btn").textContent = showHistory?"← Séance":"Historique";
  if(showHistory) renderHistory();
  else renderDay();
}

// ─── RENDER ALL ───────────────────────────────────────────────────────────────
function renderAll(){
  renderTabs();
  document.getElementById("history").style.display="none";
  document.getElementById("hist-toggle-btn").textContent="Historique";
  showHistory=false;
  renderDay();
}

renderAll();

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("./sw.js").catch(()=>{});
}
</script>
